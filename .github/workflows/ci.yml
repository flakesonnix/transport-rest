name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core & generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  generator-drift:
    name: Generated bindings are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo run -q -p transport-rest-gen -- --schema-dir schema type-script --out bindings/typescript/src --check
          cargo run -q -p transport-rest-gen -- --schema-dir schema python --out bindings/python/transport_rest --check
          cargo run -q -p transport-rest-gen -- --schema-dir schema csharp --out bindings/csharp --check
          cargo run -q -p transport-rest-gen -- --schema-dir schema java --out bindings/java --check
          cargo run -q -p transport-rest-gen -- --schema-dir schema meta --out bindings --check
      # Go output is normalized through gofmt before comparing.
      - name: Go drift check (gofmt-normalized)
        run: |
          cargo run -q -p transport-rest-gen -- --schema-dir schema go --out /tmp/gen-go
          gofmt /tmp/gen-go/models_gen.go > /tmp/gen-go/formatted.go
          diff -u bindings/go/models_gen.go /tmp/gen-go/formatted.go

  python:
    name: Python binding (stdlib)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s bindings/python/tests -t bindings/python -v

  typescript:
    name: TypeScript binding (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bindings/typescript
        run: npm install --no-audit --no-fund
      - working-directory: bindings/typescript
        run: bunx tsc --noEmit
      - working-directory: bindings/typescript
        run: bun test

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: bindings/go/go.mod
      - working-directory: bindings/go
        run: test -z "$(gofmt -l .)"
      - working-directory: bindings/go
        run: go vet ./...
      - working-directory: bindings/go
        run: go test ./...

  csharp:
    name: C# binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - working-directory: bindings/csharp
        run: dotnet build -warnaserror
      - working-directory: bindings/csharp
        run: dotnet test Tests/TransportRest.Tests.csproj

  java:
    name: Java binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - working-directory: bindings/java
        run: mvn -B --no-transfer-progress verify
